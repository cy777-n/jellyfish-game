<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水母合成大作戰</title>
    <meta name="description" content="來玩水母！">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="水母合成大作戰">
    <meta property="og:url" content="https://cy777-n.github.io/jellyfish-game/">
    <meta property="og:title" content="水母合成大作戰">
    <meta property="og:description" content="來玩水母！">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="水母合成大作戰">
    <meta name="twitter:description" content="來玩水母！">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000b14; font-family: 'Arial Rounded MT Bold', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; min-height: 0; touch-action: none; }
        #ui-top {
            width: 100%; max-width: 600px; box-sizing: border-box;
            display: grid; grid-template-columns: minmax(58px,.8fr) minmax(0,1.7fr) minmax(76px,1fr) auto;
            grid-template-areas: "score guide best sound";
            align-items: center; gap: 5px; padding: 4px 7px;
            z-index: 10; flex-shrink: 0;
        }
        .score-box {
            color: #fff; font-size: 10px; background: rgba(255,255,255,.085);
            padding: 3px 5px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16);
            text-align: center; min-width: 0; min-height: 39px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center; gap: 1px;
            backdrop-filter: blur(6px);
        }
        .score-box span { display: block; font-size: 16px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; }
        #ui-top > .score-box:first-child { grid-area: score; }
        #ui-top > .score-box:nth-of-type(2) { grid-area: best; }
        .next-hint { font-size: 8px; color: rgba(255,255,255,.62); margin-top: 1px; display: flex; align-items: center; justify-content: center; gap: 3px; }
        #next-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 3px rgba(255,255,255,.4); }
        #evolution-guide {
            grid-area: guide; display: flex; justify-content: center; align-items: center;
            flex-wrap: nowrap; gap: 2px; width: 100%; min-width: 0; height: 30px;
            box-sizing: border-box; overflow: hidden; padding: 2px 3px;
            background: rgba(255,255,255,.045); border-radius: 9px;
            border: 1px solid rgba(255,255,255,.08);
        }
        .guide-circle { border-radius: 50%; margin: 0; flex: 0 1 auto; border: 1px solid rgba(255,255,255,.88); }
        .guide-arrow { display: none; }
        #game-container { width: 98%; max-width: 550px; min-height: 0; flex-grow: 1; position: relative; border: 3px solid #4fc3f7; border-top: none; border-radius: 0 0 25px 25px; background: linear-gradient(to bottom, #001a2e, #000b14); box-shadow: 0 5px 20px rgba(0,0,0,0.8); margin-bottom: 10px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; text-align: center; display: none; z-index: 100; width: 200px; }
        button { background: #ff4081; border: none; color: white; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 15px; }
#sound-toggle {
            grid-area: sound; align-self: center; margin: 0; min-width: 48px;
            height: 36px; padding: 0 7px; border-radius: 10px; font-size: 10px;
            background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
            white-space: nowrap; color: #dceaf4;
        }
        #sound-toggle.off { opacity: .62; }
        @media (max-width: 700px) and (orientation: landscape) {
            #ui-top { padding: 2px 6px; gap: 4px; grid-template-columns: minmax(48px,.8fr) minmax(0,1.7fr) minmax(66px,1fr) auto; }
            .score-box { min-height: 32px; padding: 2px 4px; font-size: 9px; border-radius: 8px; }
            .score-box span { font-size: 13px; }
            .next-hint { font-size: 7px; }
            #evolution-guide { height: 24px; gap: 1px; padding: 1px 2px; }
            #sound-toggle { min-width: 43px; height: 29px; padding: 0 5px; font-size: 9px; border-radius: 8px; }
            #game-container { width: min(98%, 900px); margin-bottom: 3px; border-radius: 0 0 14px 14px; }
        }
        @media (max-width: 390px) and (orientation: portrait) {
            #ui-top { padding: 3px 5px; gap: 3px; grid-template-columns: minmax(48px,.8fr) minmax(0,1.65fr) minmax(65px,1fr) auto; }
            .score-box { min-height: 36px; padding: 2px 3px; }
            .score-box span { font-size: 14px; }
            #evolution-guide { height: 26px; gap: 1px; padding: 1px; }
            #sound-toggle { min-width: 42px; height: 32px; padding: 0 4px; font-size: 9px; }
        }
    </style>
</head>
<body>
<div id="ui-top">
    <div class="score-box">得分<span id="score">0</span></div>
    <div id="evolution-guide"></div>
    <div class="score-box">最高<span id="highscore">0</span><div class="next-hint">NEXT <div id="next-dot"></div></div></div>
    <button id="sound-toggle" type="button" aria-label="切換遊戲音效">🔊 音效開</button>
</div>
<div id="game-container">
    <div id="game-over"><h2>滿出來了！</h2><p>得分: <span id="final-score">0</span></p><button onclick="startNewGame()">重新挑戰</button></div>
</div>
<script>
const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
const mergeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3');
const dropSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3');
let soundEnabled = localStorage.getItem('jellySoundEnabled') !== 'false';
let engine, render, runner, currentJelly = null, nextLevel = null;
let wallBodies = [];
let skipSaveOnUnload = false;
let score = 0, isGameOver = false, isTouching = false;
let highscore = parseInt(localStorage.getItem("jellyHighscore")) || 0;

// 儲存目前遊戲進度用的 key。
// 這和最高分使用不同的 key，所以重新整理/關閉網頁不會把最高分或遊戲進度弄混。
const SAVE_KEY = "jellyGameSave_v1";

const PINK_BLUSH = '#FFB6C1'; 
const jellyConfigs = [
    { r: 8, color: '#fcf0f5', eyeSize: 1.0 }, { r: 15, color: '#f9de90', eyeSize: 1.5 }, 
    { r: 23, color: '#f8c6a1', eyeSize: 2.0 }, { r: 32, color: '#dca8c2', eyeSize: 2.8 }, 
    { r: 42, color: '#ba9fe1', eyeSize: 3.5 }, { r: 52, color: '#a0d4cd', eyeSize: 4.5 }, 
    { r: 62, color: '#87b8e5', eyeSize: 5.5 }, { r: 72, color: '#c57ca1', eyeSize: 6.5 }, 
    { r: 82, color: '#6fb5cf', eyeSize: 7.5 }, { r: 88, color: '#3071a4', eyeSize: 8.5 }, 
    { r: 95, color: '#5e4373', eyeSize: 9.5 }  
];

const DEADLINE_Y = 55; 
const SPAWN_Y = 30;

function init() {
    document.getElementById('highscore').innerText = highscore;
    createGuide();
    const container = document.getElementById('game-container');
    engine = Engine.create();
    const cw = Math.max(1, container.clientWidth);
    const ch = Math.max(1, container.clientHeight);
    render = Render.create({
        element: container, engine: engine,
        options: { width: cw, height: ch, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio || 1 }
    });
    rebuildWalls(cw, ch);
    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);
    setupEvents();
    drawLoop();

    if (!loadGame()) {
        nextLevel = getRandomLevel();
        spawnNew();
        saveGame();
    }

    setInterval(() => { if (!skipSaveOnUnload) saveGame(); }, 500);
    const safeSave = () => { if (!skipSaveOnUnload) saveGame(); };
    window.addEventListener('beforeunload', safeSave);
    window.addEventListener('pagehide', safeSave);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') safeSave();
    });

    let resizeTimer;
    const handleResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeGame, 120);
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize);
}

function rebuildWalls(cw, ch) {
    if (wallBodies.length) Composite.remove(engine.world, wallBodies);
    const ground = Bodies.rectangle(cw / 2, ch + 20, cw + 80, 40, { isStatic: true, label: 'wall_ground' });
    const leftWall = Bodies.rectangle(-20, ch / 2, 40, ch + 80, { isStatic: true, label: 'wall_left' });
    const rightWall = Bodies.rectangle(cw + 20, ch / 2, 40, ch + 80, { isStatic: true, label: 'wall_right' });
    wallBodies = [ground, leftWall, rightWall];
    Composite.add(engine.world, wallBodies);
}

function resizeGame() {
    if (!engine || !render) return;
    const container = document.getElementById('game-container');
    const oldW = render.options.width || render.canvas.width;
    const oldH = render.options.height || render.canvas.height;
    const newW = Math.max(1, container.clientWidth);
    const newH = Math.max(1, container.clientHeight);
    if (Math.abs(oldW - newW) < 2 && Math.abs(oldH - newH) < 2) return;
    const sx = newW / oldW;
    const sy = newH / oldH;
    Composite.allBodies(engine.world).forEach(body => {
        if (wallBodies.includes(body)) return;
        Body.setPosition(body, { x: Math.max(0, Math.min(newW, body.position.x * sx)), y: Math.max(0, Math.min(newH + 100, body.position.y * sy)) });
        Body.setVelocity(body, { x: body.velocity.x * sx, y: body.velocity.y * sy });
    });
    Render.setSize(render, newW, newH);
    render.options.pixelRatio = window.devicePixelRatio || 1;
    rebuildWalls(newW, newH);
    if (currentJelly) {
        const r = jellyConfigs[currentJelly.level].r;
        Body.setPosition(currentJelly, { x: Math.max(r, Math.min(newW - r, currentJelly.position.x)), y: SPAWN_Y });
    }
    saveGame();
}

function getRandomLevel() {
    const rand = Math.random();
    if (rand < 0.35) return 0;
    if (rand < 0.70) return 1;
    if (rand < 0.92) return 2;
    return 3;
}


// 把目前場上的水母、分數、下一顆水母等資訊存到瀏覽器。
// localStorage 不會因為關閉網頁而消失，因此下次回來可以繼續。
function saveGame() {
    if (!engine || !render) return;

    try {
        const bodies = Composite.allBodies(engine.world)
            .filter(body => body.label && body.label.startsWith('jelly_'))
            .map(body => ({
                level: body.level,
                x: body.position.x,
                y: body.position.y,
                vx: body.velocity.x,
                vy: body.velocity.y,
                angle: body.angle,
                angularVelocity: body.angularVelocity,
                isStatic: body.isStatic
            }));

        const saveData = {
            score,
            nextLevel,
            isGameOver,
            bodies,
            savedAt: Date.now()
        };

        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (error) {
        console.warn("遊戲進度儲存失敗：", error);
    }
}

// 讀取上次的遊戲進度
function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;

        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.bodies)) return false;

        score = Number(data.score) || 0;
        nextLevel = Number.isInteger(data.nextLevel) ? data.nextLevel : getRandomLevel();
        isGameOver = Boolean(data.isGameOver);

        document.getElementById('score').innerText = score;
        document.getElementById('highscore').innerText = highscore;
        document.getElementById('next-dot').style.background = jellyConfigs[nextLevel].color;

        data.bodies.forEach(saved => {
            if (!Number.isInteger(saved.level) || !jellyConfigs[saved.level]) return;

            const body = Bodies.circle(
                Number(saved.x) || render.canvas.width / 2,
                Number(saved.y) || SPAWN_Y,
                jellyConfigs[saved.level].r,
                {
                    isStatic: Boolean(saved.isStatic),
                    label: 'jelly_' + saved.level,
                    restitution: 0.1,
                    friction: 0.9
                }
            );

            body.level = saved.level;
            Body.setAngle(body, Number(saved.angle) || 0);

            if (!body.isStatic) {
                Body.setVelocity(body, {
                    x: Number(saved.vx) || 0,
                    y: Number(saved.vy) || 0
                });
                Body.setAngularVelocity(body, Number(saved.angularVelocity) || 0);
            }

            Composite.add(engine.world, body);

            // 上次離開時如果這顆是正在等待玩家放下的水母，
            // 恢復後仍然可以繼續拖著它移動。
            if (body.isStatic && !currentJelly) {
                currentJelly = body;
            }
        });

        if (isGameOver) {
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        } else if (!currentJelly) {
            // 如果剛好在「放下後、下一顆生成前」關閉網頁，
            // 回來時直接補生成下一顆，不會卡住。
            spawnNew();
        }

        return true;
    } catch (error) {
        console.warn("遊戲進度讀取失敗，將開啟新遊戲：", error);
        localStorage.removeItem(SAVE_KEY);
        return false;
    }
}

// 「重新挑戰」才會清除目前進度；單純關閉/重新整理不會清除。
function startNewGame() {
    skipSaveOnUnload = true;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
}


function createGuide() {
    const guide = document.getElementById('evolution-guide');
    guide.innerHTML = '';
    jellyConfigs.forEach((cfg) => {
        const circle = document.createElement('div');
        circle.className = 'guide-circle';
        const size = Math.max(5, Math.min(17, cfg.r * 0.18));
        circle.style.width = size + 'px';
        circle.style.height = size + 'px';
        circle.style.background = cfg.color;
        guide.appendChild(circle);
    });
}

function spawnNew() {
    if (isGameOver) return;
    const cw = render.canvas.width;
    const level = nextLevel;
    currentJelly = Bodies.circle(cw/2, SPAWN_Y, jellyConfigs[level].r, {
        isStatic: true, label: 'jelly_' + level, restitution: 0.1, friction: 0.9
    });
    currentJelly.level = level;
    Composite.add(engine.world, currentJelly);
    nextLevel = getRandomLevel();
    document.getElementById('next-dot').style.background = jellyConfigs[nextLevel].color;
}

function setupEvents() {
    const canvas = render.canvas;
    const updatePos = (clientX) => {
        if (!currentJelly || isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const r = jellyConfigs[currentJelly.level].r;
        const cw = canvas.width;
        Body.setPosition(currentJelly, { x: Math.max(r, Math.min(cw - r, x)), y: SPAWN_Y });
    };
    const handleStart = (e) => {
        if (isGameOver) return;
        isTouching = true;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        updatePos(x);
    };
    const handleMove = (e) => {
        if (isTouching) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            updatePos(x);
        }
    };
    const handleEnd = () => {
        if (!currentJelly || isGameOver || !isTouching) return;
        isTouching = false;
        Body.setStatic(currentJelly, false);
        if (soundEnabled) { dropSound.currentTime = 0; dropSound.play().catch(()=>{}); }
        currentJelly = null;
        saveGame();
        setTimeout(() => {
            spawnNew();
            saveGame();
        }, 800);
    };
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(); }, {passive: false});

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const { bodyA, bodyB } = pair;
            if (bodyA.label && bodyA.label === bodyB.label && bodyA.label.startsWith('jelly_')) {
                const lvl = bodyA.level;
                if (lvl < 10) {
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;
                    if (Composite.get(engine.world, bodyA.id, 'body') && Composite.get(engine.world, bodyB.id, 'body')) {
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        if (soundEnabled) { mergeSound.currentTime = 0; mergeSound.play().catch(()=>{}); }
                        const nextLvl = lvl + 1;
                        const newJelly = Bodies.circle(midX, midY, jellyConfigs[nextLvl].r, {
                            label: 'jelly_' + nextLvl, restitution: 0.1, friction: 0.9
                        });
                        newJelly.level = nextLvl;
                        Composite.add(engine.world, newJelly);
                        score += (lvl + 1) * 8;
                        document.getElementById('score').innerText = score;
                        saveGame();
                        if (score > highscore) {
                            highscore = score;
                            document.getElementById('highscore').innerText = highscore;
                            localStorage.setItem("jellyHighscore", highscore);
                        }
                        saveGame();
                    }
                }
            }
        });
    });

    Events.on(engine, 'afterUpdate', () => {
        Composite.allBodies(engine.world).forEach(body => {
            if (!body.isStatic && body.position.y < DEADLINE_Y && body !== currentJelly) {
                if (Math.abs(body.velocity.y) < 0.01) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                    saveGame();
                }
            }
        });
    });
}

function drawLoop() {
    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);
        
        if (currentJelly && currentJelly.isStatic) {
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.moveTo(currentJelly.position.x, currentJelly.position.y + jellyConfigs[currentJelly.level].r);
            ctx.lineTo(currentJelly.position.x, render.canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        bodies.forEach(body => {
            if (!body.label || !body.label.startsWith('jelly_')) return;
            const config = jellyConfigs[body.level];
            const { x, y } = body.position;
            const r = config.r;
            ctx.save(); ctx.translate(x, y); ctx.rotate(body.angle);
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = config.color; ctx.fill();
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = PINK_BLUSH;
            ctx.arc(-r*0.4, r*0.1, r*0.18, 0, Math.PI*2); ctx.arc(r*0.4, r*0.1, r*0.18, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#212121';
            ctx.beginPath(); ctx.arc(-r*0.28, -r*0.1, config.eyeSize, 0, Math.PI*2);
            ctx.arc(r*0.28, -r*0.1, config.eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, r*0.15, r*0.12, 0.2, Math.PI - 0.2);
            ctx.strokeStyle = '#212121'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = config.color;
            for(let i=0; i<5; i++){
                const step = (r * 2) / 5; const tx = -r + (i * step) + step/2;
                ctx.arc(tx, r*0.8, step/2, 0, Math.PI);
            }
            ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
        });
        
        ctx.save();
        ctx.beginPath(); 
        ctx.setLineDash([15, 10]); 
        ctx.moveTo(0, DEADLINE_Y);
        ctx.lineTo(render.canvas.width, DEADLINE_Y); 
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; 
        ctx.lineWidth = 4;
        ctx.stroke(); 
        ctx.restore();
    });
}
init();
const soundToggle = document.getElementById('sound-toggle');
function updateSoundButton() {
    soundToggle.innerText = soundEnabled ? '🔊 音效開' : '🔇 音效關';
    soundToggle.classList.toggle('off', !soundEnabled);
}
soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('jellySoundEnabled', soundEnabled);
    updateSoundButton();
    if (!soundEnabled) {
        mergeSound.pause();
        dropSound.pause();
        mergeSound.currentTime = 0;
        dropSound.currentTime = 0;
    }
});
updateSoundButton();

</script>
</body>
</html>
