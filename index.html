<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水母合成大作戰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body { margin: 0; background: #000b14; font-family: 'Arial Rounded MT Bold', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; height: 100vh; height: -webkit-fill-available; touch-action: none; }
        #ui-top { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; box-sizing: border-box; z-index: 10; flex-shrink: 0; }
        .score-box { color: #fff; font-size: 12px; background: rgba(255, 255, 255, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); text-align: center; min-width: 70px; backdrop-filter: blur(5px); }
        .score-box span { display: block; font-size: 16px; font-weight: bold; }
        .next-hint { font-size: 9px; color: rgba(255,255,255,0.6); margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 4px; }
        #next-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 4px rgba(255,255,255,0.5); }
        #evolution-guide { display: flex; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.08); padding: 6px 10px; border-radius: 12px; flex-wrap: wrap; max-width: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .guide-circle { border-radius: 50%; margin: 2px; border: 1px solid #fff; }
        .guide-arrow { color: rgba(255,255,255,0.3); font-size: 8px; margin: 0 1px; }
        #game-container { width: 98%; max-width: 550px; flex-grow: 1; position: relative; border: 3px solid #4fc3f7; border-top: none; border-radius: 0 0 25px 25px; background: linear-gradient(to bottom, #001a2e, #000b14); box-shadow: 0 5px 20px rgba(0,0,0,0.8); margin-bottom: 10px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        #audio-controls { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 6px; }
        .audio-btn { margin: 0; padding: 5px 9px; border-radius: 12px; font-size: 10px; font-weight: bold; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22); color: rgba(255,255,255,0.9); backdrop-filter: blur(5px); cursor: pointer; }
        .audio-btn.off { background: rgba(0,0,0,0.28); color: rgba(255,255,255,0.45); border-color: rgba(255,255,255,0.12); }
        .audio-btn:active { transform: scale(0.96); }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 20px; text-align: center; display: none; z-index: 100; width: 200px; }
        button { background: #ff4081; border: none; color: white; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
<div id="ui-top">
    <div class="score-box">得分<span id="score">0</span></div>
    <div id="evolution-guide"></div>
    <div class="score-box">最高<span id="highscore">0</span><div class="next-hint">NEXT <div id="next-dot"></div></div></div>
</div>
<div id="game-container">
    <div id="audio-controls">
        <button id="bgm-toggle" class="audio-btn" type="button">♫ 音樂：開</button>
        <button id="sfx-toggle" class="audio-btn" type="button">🔔 音效：開</button>
    </div>
    <div id="game-over"><h2>滿出來了！</h2><p>得分: <span id="final-score">0</span></p><button onclick="startNewGame()">重新挑戰</button></div>
</div>
<script>
const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
// 音樂與音效完全分開控制。
// 遊戲只控制自己的音訊，不會控制、暫停、靜音或改變 Spotify。
const mergeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3');
const dropSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3');

// 背景音樂使用 Web Audio API 產生，不需要外部音樂檔。
let musicContext = null;
let musicGain = null;
let musicTimer = null;
let musicStep = 0;
const musicNotes = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 440.00, 349.23];

let soundEnabled = localStorage.getItem('jellySoundEnabled') !== 'false';
let musicEnabled = localStorage.getItem('jellyMusicEnabled') !== 'false';
let audioStarted = false;

let engine, render, runner, currentJelly = null, nextLevel = null;
let score = 0, isGameOver = false, isTouching = false;
let highscore = parseInt(localStorage.getItem("jellyHighscore")) || 0;

// 儲存目前遊戲進度用的 key。
// 這和最高分使用不同的 key，所以重新整理/關閉網頁不會把最高分或遊戲進度弄混。
const SAVE_KEY = "jellyGameSave_v1";

const PINK_BLUSH = '#FFB6C1'; 
const jellyConfigs = [
    { r: 8, color: '#fcf0f5', eyeSize: 1.0 }, { r: 15, color: '#f9de90', eyeSize: 1.5 }, 
    { r: 23, color: '#f8c6a1', eyeSize: 2.0 }, { r: 32, color: '#dca8c2', eyeSize: 2.8 }, 
    { r: 42, color: '#ba9fe1', eyeSize: 3.5 }, { r: 52, color: '#a0d4cd', eyeSize: 4.5 }, 
    { r: 62, color: '#87b8e5', eyeSize: 5.5 }, { r: 72, color: '#c57ca1', eyeSize: 6.5 }, 
    { r: 82, color: '#6fb5cf', eyeSize: 7.5 }, { r: 88, color: '#3071a4', eyeSize: 8.5 }, 
    { r: 95, color: '#5e4373', eyeSize: 9.5 }  
];

const DEADLINE_Y = 55; 
const SPAWN_Y = 30;

function updateAudioButtons() {
    const musicBtn = document.getElementById('bgm-toggle');
    const soundBtn = document.getElementById('sfx-toggle');

    musicBtn.innerText = musicEnabled ? '♫ 音樂：開' : '♫ 音樂：關';
    soundBtn.innerText = soundEnabled ? '🔔 音效：開' : '🔔 音效：關';

    musicBtn.classList.toggle('off', !musicEnabled);
    soundBtn.classList.toggle('off', !soundEnabled);
}

function playSound(audio) {
    if (!soundEnabled) return;
    try {
        audio.currentTime = 0;
        audio.play().catch(() => {});
    } catch (error) {}
}

function startBackgroundMusic() {
    if (!musicEnabled) return;

    try {
        if (!musicContext) {
            musicContext = new (window.AudioContext || window.webkitAudioContext)();
            musicGain = musicContext.createGain();
            musicGain.gain.value = 0.045;
            musicGain.connect(musicContext.destination);
        }

        if (musicContext.state === 'suspended') {
            musicContext.resume();
        }

        // 已經在播放就不要重複建立計時器。
        if (musicTimer) return;

        const playNote = () => {
            if (!musicContext || !musicGain || !musicEnabled) return;

            const osc = musicContext.createOscillator();
            const noteGain = musicContext.createGain();
            const now = musicContext.currentTime;
            const frequency = musicNotes[musicStep % musicNotes.length];

            osc.type = 'sine';
            osc.frequency.setValueAtTime(frequency, now);

            noteGain.gain.setValueAtTime(0.0001, now);
            noteGain.gain.exponentialRampToValueAtTime(0.16, now + 0.08);
            noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.40);

            osc.connect(noteGain);
            noteGain.connect(musicGain);
            osc.start(now);
            osc.stop(now + 1.45);

            musicStep++;
        };

        playNote();
        musicTimer = setInterval(playNote, 1500);
    } catch (error) {
        console.warn('背景音樂無法啟動：', error);
    }
}

function stopBackgroundMusic() {
    // 清除下一個音符的排程。
    if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
    }

    // 立即把目前正在響的背景音樂淡出。
    if (musicGain && musicContext) {
        try {
            const now = musicContext.currentTime;
            musicGain.gain.cancelScheduledValues(now);
            musicGain.gain.setValueAtTime(musicGain.gain.value || 0.045, now);
            musicGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
        } catch (error) {}
    }
}

function startAudioAfterUserGesture() {
    audioStarted = true;

    if (musicEnabled) {
        startBackgroundMusic();
    }
}

function setMusicEnabled(enabled) {
    musicEnabled = enabled;
    localStorage.setItem('jellyMusicEnabled', musicEnabled);

    if (musicEnabled) {
        // 重新開啟時，先恢復 AudioContext，再重新開始旋律。
        startBackgroundMusic();
    } else {
        stopBackgroundMusic();
    }

    updateAudioButtons();
}

function setSoundEnabled(enabled) {
    soundEnabled = enabled;
    localStorage.setItem('jellySoundEnabled', soundEnabled);
    updateAudioButtons();
}

function setupAudioControls() {
    updateAudioButtons();

    document.getElementById('bgm-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        audioStarted = true;
        setMusicEnabled(!musicEnabled);
    });

    document.getElementById('sfx-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        startAudioAfterUserGesture();
        setSoundEnabled(!soundEnabled);
    });

    // 第一次點擊遊戲時才啟動網頁自己的音訊，符合瀏覽器的 autoplay 規則。
    // 這只啟動遊戲自己的音訊，不會控制 Spotify。
    window.addEventListener('pointerdown', startAudioAfterUserGesture, { once: true });
}

function init() {
    document.getElementById('highscore').innerText = highscore;
    setupAudioControls();
    createGuide();
    const container = document.getElementById('game-container');
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    engine = Engine.create();
    render = Render.create({
        element: container, engine: engine,
        options: { width: cw, height: ch, wireframes: false, background: 'transparent', pixelRatio: window.devicePixelRatio }
    });
    const ground = Bodies.rectangle(cw/2, ch + 20, cw, 40, { isStatic: true });
    const leftWall = Bodies.rectangle(-20, ch/2, 40, ch, { isStatic: true });
    const rightWall = Bodies.rectangle(cw + 20, ch/2, 40, ch, { isStatic: true });
    Composite.add(engine.world, [ground, leftWall, rightWall]);
    Render.run(render);
    runner = Runner.create();
    Runner.run(runner, engine);
    setupEvents();
    drawLoop();

    // 優先讀取上次離開時的進度；沒有存檔才開新局
    if (!loadGame()) {
        nextLevel = getRandomLevel();
        spawnNew();
        saveGame();
    }

    // 定期保存，避免關閉分頁時只靠 beforeunload 而漏存
    setInterval(saveGame, 500);

    // 關閉分頁、切換 App、重新整理時都盡量保存
    window.addEventListener("beforeunload", saveGame);
    window.addEventListener("pagehide", saveGame);
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") saveGame();
    });
    window.addEventListener('resize', () => {
        const cw = container.clientWidth;
        const ch = container.clientHeight;
        render.canvas.width = cw;
        render.canvas.height = ch;
        Body.setPosition(ground, { x: cw/2, y: ch + 20 });
    });
}

function getRandomLevel() {
    const rand = Math.random();
    if (rand < 0.35) return 0;
    if (rand < 0.70) return 1;
    if (rand < 0.92) return 2;
    return 3;
}


// 把目前場上的水母、分數、下一顆水母等資訊存到瀏覽器。
// localStorage 不會因為關閉網頁而消失，因此下次回來可以繼續。
function saveGame() {
    if (!engine || !render) return;

    try {
        const bodies = Composite.allBodies(engine.world)
            .filter(body => body.label && body.label.startsWith('jelly_'))
            .map(body => ({
                level: body.level,
                x: body.position.x,
                y: body.position.y,
                vx: body.velocity.x,
                vy: body.velocity.y,
                angle: body.angle,
                angularVelocity: body.angularVelocity,
                isStatic: body.isStatic
            }));

        const saveData = {
            score,
            nextLevel,
            isGameOver,
            bodies,
            savedAt: Date.now()
        };

        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (error) {
        console.warn("遊戲進度儲存失敗：", error);
    }
}

// 讀取上次的遊戲進度
function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;

        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.bodies)) return false;

        score = Number(data.score) || 0;
        nextLevel = Number.isInteger(data.nextLevel) ? data.nextLevel : getRandomLevel();
        isGameOver = Boolean(data.isGameOver);

        document.getElementById('score').innerText = score;
        document.getElementById('highscore').innerText = highscore;
        document.getElementById('next-dot').style.background = jellyConfigs[nextLevel].color;

        data.bodies.forEach(saved => {
            if (!Number.isInteger(saved.level) || !jellyConfigs[saved.level]) return;

            const body = Bodies.circle(
                Number(saved.x) || render.canvas.width / 2,
                Number(saved.y) || SPAWN_Y,
                jellyConfigs[saved.level].r,
                {
                    isStatic: Boolean(saved.isStatic),
                    label: 'jelly_' + saved.level,
                    restitution: 0.1,
                    friction: 0.9
                }
            );

            body.level = saved.level;
            Body.setAngle(body, Number(saved.angle) || 0);

            if (!body.isStatic) {
                Body.setVelocity(body, {
                    x: Number(saved.vx) || 0,
                    y: Number(saved.vy) || 0
                });
                Body.setAngularVelocity(body, Number(saved.angularVelocity) || 0);
            }

            Composite.add(engine.world, body);

            // 上次離開時如果這顆是正在等待玩家放下的水母，
            // 恢復後仍然可以繼續拖著它移動。
            if (body.isStatic && !currentJelly) {
                currentJelly = body;
            }
        });

        if (isGameOver) {
            document.getElementById('game-over').style.display = 'block';
            document.getElementById('final-score').innerText = score;
        } else if (!currentJelly) {
            // 如果剛好在「放下後、下一顆生成前」關閉網頁，
            // 回來時直接補生成下一顆，不會卡住。
            spawnNew();
        }

        return true;
    } catch (error) {
        console.warn("遊戲進度讀取失敗，將開啟新遊戲：", error);
        localStorage.removeItem(SAVE_KEY);
        return false;
    }
}

// 「重新挑戰」才會清除目前進度；單純關閉/重新整理不會清除。
function startNewGame() {
    localStorage.removeItem(SAVE_KEY);
    location.reload();
}


function createGuide() {
    const guide = document.getElementById('evolution-guide');
    guide.innerHTML = '';
    jellyConfigs.forEach((config, index) => {
        const circle = document.createElement('div');
        circle.className = 'guide-circle';
        const size = 3 + index * 1.1; 
        circle.style.width = size + 'px'; circle.style.height = size + 'px';
        circle.style.background = config.color;
        guide.appendChild(circle);
        if(index < 10) {
            const arrow = document.createElement('div');
            arrow.className = 'guide-arrow'; arrow.innerText = '›';
            guide.appendChild(arrow);
        }
    });
}

function spawnNew() {
    if (isGameOver) return;
    const cw = render.canvas.width;
    const level = nextLevel;
    currentJelly = Bodies.circle(cw/2, SPAWN_Y, jellyConfigs[level].r, {
        isStatic: true, label: 'jelly_' + level, restitution: 0.1, friction: 0.9
    });
    currentJelly.level = level;
    Composite.add(engine.world, currentJelly);
    nextLevel = getRandomLevel();
    document.getElementById('next-dot').style.background = jellyConfigs[nextLevel].color;
}

function setupEvents() {
    const canvas = render.canvas;

    document.getElementById('audio-controls').addEventListener('pointerdown', (e) => {
        e.stopPropagation();
    });

    const updatePos = (clientX) => {
        if (!currentJelly || isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const r = jellyConfigs[currentJelly.level].r;
        const cw = canvas.width;
        Body.setPosition(currentJelly, { x: Math.max(r, Math.min(cw - r, x)), y: SPAWN_Y });
    };
    const handleStart = (e) => {
        if (isGameOver) return;
        isTouching = true;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        updatePos(x);
    };
    const handleMove = (e) => {
        if (isTouching) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            updatePos(x);
        }
    };
    const handleEnd = () => {
        if (!currentJelly || isGameOver || !isTouching) return;
        isTouching = false;
        Body.setStatic(currentJelly, false);
        playSound(dropSound);
        currentJelly = null;
        saveGame();
        setTimeout(() => {
            spawnNew();
            saveGame();
        }, 800);
    };
    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleEnd(); }, {passive: false});

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const { bodyA, bodyB } = pair;
            if (bodyA.label && bodyA.label === bodyB.label && bodyA.label.startsWith('jelly_')) {
                const lvl = bodyA.level;
                if (lvl < 10) {
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;
                    if (Composite.get(engine.world, bodyA.id, 'body') && Composite.get(engine.world, bodyB.id, 'body')) {
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        playSound(mergeSound);
                        const nextLvl = lvl + 1;
                        const newJelly = Bodies.circle(midX, midY, jellyConfigs[nextLvl].r, {
                            label: 'jelly_' + nextLvl, restitution: 0.1, friction: 0.9
                        });
                        newJelly.level = nextLvl;
                        Composite.add(engine.world, newJelly);
                        score += (lvl + 1) * 8;
                        document.getElementById('score').innerText = score;
                        saveGame();
                        if (score > highscore) {
                            highscore = score;
                            document.getElementById('highscore').innerText = highscore;
                            localStorage.setItem("jellyHighscore", highscore);
                        }
                        saveGame();
                    }
                }
            }
        });
    });

    Events.on(engine, 'afterUpdate', () => {
        Composite.allBodies(engine.world).forEach(body => {
            if (!body.isStatic && body.position.y < DEADLINE_Y && body !== currentJelly) {
                if (Math.abs(body.velocity.y) < 0.01) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                    saveGame();
                }
            }
        });
    });
}

function drawLoop() {
    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = Composite.allBodies(engine.world);
        
        if (currentJelly && currentJelly.isStatic) {
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.moveTo(currentJelly.position.x, currentJelly.position.y + jellyConfigs[currentJelly.level].r);
            ctx.lineTo(currentJelly.position.x, render.canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        bodies.forEach(body => {
            if (!body.label || !body.label.startsWith('jelly_')) return;
            const config = jellyConfigs[body.level];
            const { x, y } = body.position;
            const r = config.r;
            ctx.save(); ctx.translate(x, y); ctx.rotate(body.angle);
            ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fillStyle = config.color; ctx.fill();
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = PINK_BLUSH;
            ctx.arc(-r*0.4, r*0.1, r*0.18, 0, Math.PI*2); ctx.arc(r*0.4, r*0.1, r*0.18, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#212121';
            ctx.beginPath(); ctx.arc(-r*0.28, -r*0.1, config.eyeSize, 0, Math.PI*2);
            ctx.arc(r*0.28, -r*0.1, config.eyeSize, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, r*0.15, r*0.12, 0.2, Math.PI - 0.2);
            ctx.strokeStyle = '#212121'; ctx.lineWidth = 1.2; ctx.stroke();
            ctx.beginPath(); ctx.fillStyle = config.color;
            for(let i=0; i<5; i++){
                const step = (r * 2) / 5; const tx = -r + (i * step) + step/2;
                ctx.arc(tx, r*0.8, step/2, 0, Math.PI);
            }
            ctx.fill(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
        });
        
        ctx.save();
        ctx.beginPath(); 
        ctx.setLineDash([15, 10]); 
        ctx.moveTo(0, DEADLINE_Y);
        ctx.lineTo(render.canvas.width, DEADLINE_Y); 
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; 
        ctx.lineWidth = 4;
        ctx.stroke(); 
        ctx.restore();
    });
}
init();
</script>
</body>
</html>
