<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>水母合成大作戰</title>
    <meta name="description" content="來玩水母！">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="水母合成大作戰">
    <meta property="og:url" content="https://cy777-n.github.io/jellyfish-game/">
    <meta property="og:title" content="水母合成大作戰">
    <meta property="og:description" content="來玩水母！">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="水母合成大作戰">
    <meta name="twitter:description" content="來玩水母！">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body, #game-container, #game-container canvas {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body {
            margin: 0; height: 100vh; height: 100dvh; min-height: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; touch-action: none;
            background: #000b14; color: #fff;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
        }
        #ui-top {
            width: 100%; max-width: 600px; flex: 0 0 auto;
            display: grid;
            grid-template-columns: minmax(66px,1.15fr) minmax(40px,.72fr) minmax(0,2.2fr) 44px 42px;
            grid-template-areas: "score best guide sound restart";
            align-items: center; gap: 4px; padding: 6px 7px;
            z-index: 10;
        }
        .score-box {
            min-width: 0; min-height: 42px; padding: 3px 4px;
            display: flex; flex-direction: column; justify-content: center;
            gap: 1px; overflow: hidden; text-align: center;
            color: #fff; font-size: 9px; font-weight: 600;
            background: rgba(255,255,255,.085);
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 9px; backdrop-filter: blur(6px);
        }
        .score-box span {
            display: block; font-size: 14px; line-height: 1.05;
            font-weight: 800; font-variant-numeric: tabular-nums;
        }
        #score-box { grid-area: score; min-height: 46px; }
        #best-box { grid-area: best; }
        #sound-toggle { grid-area: sound; }
        #restart-game { grid-area: restart; }
        #score-box span { font-size: 20px; }
        #best-box span { font-size: 14px; }
        .next-hint {
            display: flex; align-items: center; justify-content: center;
            gap: 3px; margin-top: 2px; color: rgba(255,255,255,.72);
            font-size: 8px; line-height: 1;
        }
        #next-dot {
            width: 8px; height: 8px; flex: 0 0 8px;
            border: 1px solid #fff; border-radius: 50%;
            box-shadow: 0 0 3px rgba(255,255,255,.4);
        }
        #evolution-guide {
            grid-area: guide;
            width: 100%; min-width: 0; height: 42px; padding: 4px 3px;
            display: flex; align-items: center; justify-content: space-evenly;
            flex-wrap: nowrap; gap: 1px; overflow: hidden;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.08); border-radius: 9px;
        }
        .guide-circle {
            display: block; flex: 0 0 13px; width: 13px; height: 13px;
            min-width: 13px; min-height: 13px; max-width: 13px; aspect-ratio: 1 / 1;
            margin: 0; padding: 0; border: 1px solid rgba(255,255,255,.92);
            border-radius: 50%; transform: none;
            box-shadow: 0 0 7px rgba(255,255,255,.2);
        }
        .guide-arrow { display: none; }
        #sound-toggle, #restart-game {
            width: 100%; min-width: 0; height: 36px; margin: 0; padding: 0 2px;
            display: flex; align-items: center; justify-content: center;
            white-space: nowrap; color: #dceaf4; font-size: 9px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16); border-radius: 9px;
        }
        #sound-toggle.off { opacity: .48; }
        #game-container {
            width: 98%; max-width: 550px; min-height: 0; flex: 1 1 auto;
            position: relative; overflow: hidden; margin-bottom: 6px;
            display: flex; align-items: center; justify-content: center;
            border: 3px solid #4fc3f7; border-top: none;
            border-radius: 0 0 20px 20px;
            background: linear-gradient(to bottom, #001a2e, #000b14);
            box-shadow: 0 5px 20px rgba(0,0,0,.8);
        }
        /* 畫布保持原始世界比例，只在容器內等比例縮放，不拉寬、不壓扁。 */
        #game-container canvas {
            display: block; flex: 0 0 auto;
            width: auto !important; height: auto !important;
            max-width: 100%; max-height: 100%;
            object-fit: contain; touch-action: none;
        }
        #game-over {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 200px; padding: 25px; z-index: 100;
            display: none; text-align: center; color: #17212b;
            background: rgba(255,255,255,.95); border-radius: 20px;
        }
        button {
            background: #ff4081; border: none; color: white;
            padding: 10px 20px; border-radius: 40px;
            font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        #sound-toggle, #restart-game { margin-top: 0; }
        @media (max-width: 390px) and (orientation: portrait) {
            #ui-top {
                grid-template-columns: minmax(62px,1.1fr) minmax(36px,.7fr) minmax(0,2fr) 39px 36px;
                gap: 2px; padding: 4px 4px;
            }
            .score-box { min-height: 39px; padding: 2px 3px; font-size: 8px; }
            #score-box { min-height: 43px; }
            #score-box span { font-size: 18px; }
            #best-box span { font-size: 13px; }
            .next-hint { font-size: 7px; gap: 2px; }
            #evolution-guide { height: 34px; gap: 1px; padding: 3px 2px; }
            .guide-circle { flex: 0 0 8px; width: 8px; height: 8px; min-width: 8px; min-height: 8px; max-width: 8px; }
            #sound-toggle, #restart-game { height: 30px; font-size: 7px; padding: 0 1px; }
        }
        @media (max-width: 700px) and (orientation: landscape) {
            #ui-top {
                grid-template-columns: minmax(62px,1.1fr) minmax(36px,.7fr) minmax(0,2fr) 40px 38px;
                grid-template-areas: "score best guide sound restart";
                padding: 3px 7px 4px; gap: 3px;
            }
            .score-box { min-height: 33px; padding: 2px 4px; font-size: 8px; }
            #score-box { min-height: 36px; }
            #score-box span { font-size: 16px; }
            #best-box span { font-size: 12px; }
            .next-hint { font-size: 7px; }
            #evolution-guide { height: 30px; padding: 2px; gap: 1px; }
            .guide-circle { flex: 0 0 8px; width: 8px; height: 8px; min-width: 8px; min-height: 8px; max-width: 8px; }
            #sound-toggle, #restart-game { height: 28px; font-size: 8px; }
            #game-container { width: min(98%, 900px); margin-bottom: 3px; border-radius: 0 0 14px 14px; }
        }
    </style>

</head>
<body>
<div id="ui-top">
    <div class="score-box" id="score-box">得分<span id="score">0</span><div class="next-hint">NEXT <div id="next-dot"></div></div></div>
    <div class="score-box" id="best-box">最高<span id="highscore">0</span></div>
    <div id="evolution-guide"></div>
    <button id="sound-toggle" type="button" aria-label="切換遊戲音效" title="合成與掉落音效開關">🔊 音效</button>
    <button id="restart-game" type="button" aria-label="重新開始遊戲" onclick="startNewGame()">↻ 重來</button>
</div>
<div id="game-container">
    <div id="game-over"><h2>滿出來了！</h2><p>得分: <span id="final-score">0</span></p><button onclick="startNewGame()">重新挑戰</button></div>
</div>
<script>
const { Engine, Render, Runner, Bodies, Composite, Events, Body } = Matter;
const mergeSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2020/2020-preview.mp3');
const dropSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3');
[mergeSound, dropSound].forEach(audio => { audio.preload = 'auto'; audio.volume = 0.85; });
let soundEnabled = localStorage.getItem('jellySoundEnabled') !== 'false';
let engine, render, runner, currentJelly = null, nextLevel = null;
let wallBodies = [];
let skipSaveOnUnload = false;

// 使用固定物理步長，並在繪圖時插值，讓手機上的掉落動畫更平順。
const PHYSICS_STEP = 1000 / 60;
const MAX_FRAME_DELTA = 50;
const MAX_PHYSICS_STEPS = 3;
let physicsAccumulator = 0;
let lastPhysicsFrame = 0;
let physicsAlpha = 1;
let physicsFrameId = 0;
const jellySprites = [];
// 保留裝置原生像素密度，避免為了效能降低畫布解析度而模糊。
const GAME_PIXEL_RATIO = Math.max(1, window.devicePixelRatio || 1);
let score = 0, isGameOver = false, isTouching = false;
const topZoneTimers = new WeakMap();
const dropGraceUntil = new WeakMap();
const hasEnteredPlayfield = new WeakSet(); // 只有確實落進警戒線下方的水母，之後才可觸發滿出判定。
let highscore = parseInt(localStorage.getItem("jellyHighscore")) || 0;

// 儲存目前遊戲進度用的 key。
// 這和最高分使用不同的 key，所以重新整理/關閉網頁不會把最高分或遊戲進度弄混。
const SAVE_KEY = "jellyGameSave_v1";

const PINK_BLUSH = '#FFB6C1'; 
const jellyConfigs = [
    { r: 8, color: '#fcf0f5', eyeSize: 1.0 }, { r: 15, color: '#f9de90', eyeSize: 1.5 }, 
    { r: 23, color: '#f8c6a1', eyeSize: 2.0 }, { r: 32, color: '#dca8c2', eyeSize: 2.8 }, 
    { r: 42, color: '#ba9fe1', eyeSize: 3.5 }, { r: 52, color: '#a0d4cd', eyeSize: 4.5 }, 
    { r: 62, color: '#87b8e5', eyeSize: 5.5 }, { r: 72, color: '#c57ca1', eyeSize: 6.5 }, 
    { r: 82, color: '#6fb5cf', eyeSize: 7.5 }, { r: 88, color: '#3071a4', eyeSize: 8.5 }, 
    { r: 95, color: '#5e4373', eyeSize: 9.5 }  
];

const DEADLINE_Y = 55; 
const SPAWN_Y = 30;

// 保留原本清脆的掉落／合成音效來源；每次觸發都從頭播放。
function playGameSfx(audio) {
    if (!soundEnabled) return;
    try {
        audio.pause();
        audio.currentTime = 0;
        const result = audio.play();
        if (result && typeof result.catch === 'function') result.catch(() => {});
    } catch (error) {}
}


// 將各階水母預先畫成小圖，遊戲進行時只需 drawImage，
// 避免每一幀、每一顆水母都重新建立大量 Canvas 路徑。
function buildJellySprites(pixelRatio = GAME_PIXEL_RATIO) {
    jellyConfigs.forEach((config, level) => {
        const r = config.r;
        const pad = 3;
        const size = Math.ceil(r * 2 + pad * 2);
        const sprite = document.createElement('canvas');
        // Sprite 也以裝置原生解析度繪製，避免高 DPI 手機放大時變糊。
        sprite.width = Math.ceil(size * pixelRatio);
        sprite.height = Math.ceil(size * pixelRatio);
        const ctx = sprite.getContext('2d');
        ctx.scale(pixelRatio, pixelRatio);
        const cx = size / 2;
        const cy = size / 2;

        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = config.color;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = PINK_BLUSH;
        ctx.arc(-r * 0.4, r * 0.1, r * 0.18, 0, Math.PI * 2);
        ctx.arc(r * 0.4, r * 0.1, r * 0.18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#212121';
        ctx.beginPath();
        ctx.arc(-r * 0.28, -r * 0.1, config.eyeSize, 0, Math.PI * 2);
        ctx.arc(r * 0.28, -r * 0.1, config.eyeSize, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, r * 0.15, r * 0.12, 0.2, Math.PI - 0.2);
        ctx.strokeStyle = '#212121';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.fillStyle = config.color;
        for (let i = 0; i < 5; i++) {
            const step = (r * 2) / 5;
            const tx = -r + (i * step) + step / 2;
            ctx.arc(tx, r * 0.8, step / 2, 0, Math.PI);
        }
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1;
        ctx.stroke();

        jellySprites[level] = { canvas: sprite, size, offset: size / 2 };
    });
}

// 固定 60Hz 更新物理世界；畫面仍由 Matter.Render 的 RAF 繪製。
// 每次畫面更新最多補算 3 步，避免手機掉幀後陷入大量追趕而越跑越卡。
function startPhysicsLoop() {
    if (physicsFrameId) cancelAnimationFrame(physicsFrameId);
    physicsAccumulator = 0;
    lastPhysicsFrame = 0;

    const tick = (timestamp) => {
        physicsFrameId = requestAnimationFrame(tick);
        if (document.hidden) {
            lastPhysicsFrame = timestamp;
            physicsAccumulator = 0;
            physicsAlpha = 1;
            return;
        }

        if (!lastPhysicsFrame) lastPhysicsFrame = timestamp;
        const frameDelta = Math.min(timestamp - lastPhysicsFrame, MAX_FRAME_DELTA);
        lastPhysicsFrame = timestamp;
        physicsAccumulator = Math.min(
            physicsAccumulator + frameDelta,
            PHYSICS_STEP * MAX_PHYSICS_STEPS
        );

        let steps = 0;
        while (physicsAccumulator >= PHYSICS_STEP && steps < MAX_PHYSICS_STEPS) {
            // 在每次物理更新前記錄上一個已完成的模擬狀態。
            // 不使用 Matter.Body.positionPrev：它是 Verlet 積分內部資料，
            // 並不等同於畫面上一幀的座標。
            const bodies = engine.world.bodies;
            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];
                body._jellyRenderPrevX = body.position.x;
                body._jellyRenderPrevY = body.position.y;
                body._jellyRenderPrevAngle = body.angle;
            }
            Engine.update(engine, PHYSICS_STEP);
            physicsAccumulator -= PHYSICS_STEP;
            steps++;
        }
        physicsAlpha = physicsAccumulator / PHYSICS_STEP;
    };

    physicsFrameId = requestAnimationFrame(tick);
}


function init() {
    document.getElementById('highscore').innerText = highscore;
    createGuide();
    const container = document.getElementById('game-container');
    // 不啟用 sleeping：避免水母在出生區或低速碰撞時提早休眠。
    // 使用 Matter.js 預設 solver iterations，避免降低碰撞穩定度。
    engine = Engine.create();
    buildJellySprites(GAME_PIXEL_RATIO);
    const savedViewport = getSavedViewport();
    const cw = savedViewport ? savedViewport.width : Math.max(1, container.clientWidth);
    const ch = savedViewport ? savedViewport.height : Math.max(1, container.clientHeight);
    render = Render.create({
        element: container, engine: engine,
        options: { width: cw, height: ch, wireframes: false, background: 'transparent', pixelRatio: GAME_PIXEL_RATIO }
    });
    rebuildWalls(cw, ch);
    Render.run(render);
    // 不再讓 Runner 與 Render 各自決定物理更新頻率，改用固定步長。
    runner = null;
    startPhysicsLoop();
    setupEvents();
    drawLoop();

    if (!loadGame()) {
        nextLevel = getRandomLevel();
        updateNextHint();
        saveGame();
    }

    const safeSave = () => {
        if (skipSaveOnUnload) return;
        clearTimeout(gameSaveTimer);
        saveGame();
    };
    window.addEventListener('beforeunload', safeSave);
    window.addEventListener('pagehide', safeSave);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') {
            safeSave();
        } else {
            lastPhysicsFrame = 0;
            physicsAccumulator = 0;
        }
    });

    let resizeTimer;
    const handleResize = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            // 方向或可視區域改變時，若手指仍按著畫面，安全結束這次拖曳，
            // 避免 pointer capture 遺失後，下一顆水母一直停留在靜止狀態。
            window.dispatchEvent(new Event('jelly-layout-change'));
            resizeGame();
        }, 180);
    };
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize);
}

function rebuildWalls(cw, ch) {
    if (wallBodies.length) Composite.remove(engine.world, wallBodies);
    const ground = Bodies.rectangle(cw / 2, ch + 20, cw + 80, 40, { isStatic: true, label: 'wall_ground' });
    const leftWall = Bodies.rectangle(-20, ch / 2, 40, ch + 80, { isStatic: true, label: 'wall_left' });
    const rightWall = Bodies.rectangle(cw + 20, ch / 2, 40, ch + 80, { isStatic: true, label: 'wall_right' });
    wallBodies = [ground, leftWall, rightWall];
    Composite.add(engine.world, wallBodies);
}

function resizeGame() {
    // 不重建 Matter.js 世界、不改變世界寬高，也不縮放任何水母物件。
    // CSS 會把原比例畫布完整放進新尺寸的容器，因此旋轉裝置不會改變遊戲狀態。
    if (!render) return;
    saveGame();
}

function getRandomLevel() {
    const rand = Math.random();
    if (rand < 0.35) return 0;
    if (rand < 0.70) return 1;
    if (rand < 0.92) return 2;
    return 3;
}


// 把目前場上的水母、分數、下一顆水母等資訊存到瀏覽器。
// localStorage 不會因為關閉網頁而消失，因此下次回來可以繼續。
let gameSaveTimer = null;

// 延後儲存，先讓放開水母的畫面立即更新，避免大量水母存檔時卡住主執行緒。
function scheduleGameSave() {
    if (skipSaveOnUnload) return;
    clearTimeout(gameSaveTimer);
    gameSaveTimer = setTimeout(() => {
        gameSaveTimer = null;
        saveGame();
    }, 450);
}

function saveGame() {
    if (!engine || !render) return;

    try {
        const bodies = engine.world.bodies
            .filter(body => body.label && body.label.startsWith('jelly_') && !(body === currentJelly && body.isStatic))
            .map(body => ({
                level: body.level,
                x: body.position.x,
                y: body.position.y,
                vx: body.velocity.x,
                vy: body.velocity.y,
                angle: body.angle,
                angularVelocity: body.angularVelocity,
                isStatic: body.isStatic
            }));

        const saveData = {
            worldWidth: render.options.width,
            worldHeight: render.options.height,
            score,
            nextLevel,
            isGameOver,
            bodies,
            savedAt: Date.now()
        };

        localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
    } catch (error) {
        console.warn("遊戲進度儲存失敗：", error);
    }
}

// 讀取上次的遊戲進度
function getSavedViewport() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (Number.isFinite(data.worldWidth) && data.worldWidth > 0 &&
            Number.isFinite(data.worldHeight) && data.worldHeight > 0) {
            return { width: data.worldWidth, height: data.worldHeight };
        }
    } catch (e) {}
    return null;
}

function loadGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;

        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.bodies)) return false;

        score = Number(data.score) || 0;
        nextLevel = Number.isInteger(data.nextLevel) ? data.nextLevel : getRandomLevel();
        // 忽略前一版錯誤判定後存下的 game-over 狀態；若場上真的堆到警戒線上方，新的穩定判定會重新確認。
        isGameOver = false;

        document.getElementById('score').innerText = score;
        document.getElementById('highscore').innerText = highscore;
        updateNextHint();

        data.bodies.forEach(saved => {
            if (!Number.isInteger(saved.level) || !jellyConfigs[saved.level]) return;
            // 舊版存檔中的靜態預覽水母不再載入；新版會等玩家碰觸才生成。
            if (saved.isStatic) return;

            const body = Bodies.circle(
                Number(saved.x) || render.options.width / 2,
                Number(saved.y) || SPAWN_Y,
                jellyConfigs[saved.level].r,
                {
                    isStatic: Boolean(saved.isStatic),
                    render: { visible: false },
                    label: 'jelly_' + saved.level,
                    restitution: 0.1,
                    friction: 0.9
                }
            );

            body.level = saved.level;
            Body.setAngle(body, Number(saved.angle) || 0);

            if (!body.isStatic) {
                Body.setVelocity(body, {
                    x: Number(saved.vx) || 0,
                    y: Number(saved.vy) || 0
                });
                Body.setAngularVelocity(body, Number(saved.angularVelocity) || 0);
            }

            Composite.add(engine.world, body);

        });


        return true;
    } catch (error) {
        console.warn("遊戲進度讀取失敗，將開啟新遊戲：", error);
        localStorage.removeItem(SAVE_KEY);
        return false;
    }
}

// 「重新挑戰」才會清除目前進度；單純關閉/重新整理不會清除。
function startNewGame() {
    const confirmed = window.confirm('確定要重新開始嗎？\n目前這一局的水母位置與分數都會清除，且無法復原。');
    if (!confirmed) return;
    skipSaveOnUnload = true;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
}


function createGuide() {
    const guide = document.getElementById('evolution-guide');
    guide.innerHTML = '';
    jellyConfigs.forEach((cfg, index) => {
        const circle = document.createElement('span');
        circle.className = 'guide-circle';
        circle.style.backgroundColor = cfg.color;
        circle.title = `第 ${index + 1} 階`;
        guide.appendChild(circle);
        if (index < jellyConfigs.length - 1) {
            const arrow = document.createElement('span');
            arrow.className = 'guide-arrow';
            arrow.textContent = '›';
            guide.appendChild(arrow);
        }
    });
}

function updateNextHint() {
    if (Number.isInteger(nextLevel) && jellyConfigs[nextLevel]) {
        document.getElementById('next-dot').style.background = jellyConfigs[nextLevel].color;
    }
}

function createCurrentJelly(x) {
    if (currentJelly || isGameOver) return;
    const cw = render.options.width;
    const level = nextLevel;
    const r = jellyConfigs[level].r;
    const safeX = Math.max(r, Math.min(cw - r, x));
    currentJelly = Bodies.circle(safeX, SPAWN_Y, r, {
        isStatic: true,
        label: 'jelly_' + level,
        restitution: 0.1,
        friction: 0.9,
        render: { visible: false }
    });
    currentJelly.level = level;
    Composite.add(engine.world, currentJelly);
    nextLevel = getRandomLevel();
    updateNextHint();
}


function setupEvents() {
    const canvas = render.canvas;

    // iOS Safari may otherwise show the Copy/Select callout after a long press.
    canvas.style.webkitTouchCallout = 'none';
    canvas.style.webkitUserSelect = 'none';
    canvas.style.userSelect = 'none';
    const blockBrowserSelection = (event) => event.preventDefault();
    document.addEventListener('contextmenu', blockBrowserSelection, { passive: false });
    document.addEventListener('selectstart', blockBrowserSelection, { passive: false });
    canvas.addEventListener('contextmenu', blockBrowserSelection, { passive: false });
    canvas.addEventListener('selectstart', blockBrowserSelection, { passive: false });
    let activePointerId = null;

    const worldX = (clientX) => {
        const rect = canvas.getBoundingClientRect();
        return (clientX - rect.left) * (render.options.width / rect.width);
    };

    const updatePos = (clientX) => {
        if (!currentJelly || isGameOver) return;
        const x = worldX(clientX);
        const r = jellyConfigs[currentJelly.level].r;
        const cw = render.options.width;
        Body.setPosition(currentJelly, { x: Math.max(r, Math.min(cw - r, x)), y: SPAWN_Y });
    };

    const handleStart = (e) => {
        if (isGameOver || activePointerId !== null) return;
        e.preventDefault();
        activePointerId = e.pointerId;
        if (!currentJelly) createCurrentJelly(worldX(e.clientX));
        updatePos(e.clientX);
        isTouching = true;
        try { canvas.setPointerCapture(e.pointerId); } catch (error) {}
    };

    const handleMove = (e) => {
        if (!isTouching || e.pointerId !== activePointerId) return;
        e.preventDefault();
        updatePos(e.clientX);
    };

    const handleEnd = (e) => {
        if (e.pointerId !== activePointerId) return;
        if (currentJelly && !isGameOver && isTouching) {
            isTouching = false;
            const released = currentJelly;
            currentJelly = null;
            Body.setStatic(released, false);
            dropGraceUntil.set(released, performance.now() + 2200);
            topZoneTimers.delete(released);
            if (soundEnabled) playGameSfx(dropSound);
            scheduleGameSave();
        }
        isTouching = false;
        activePointerId = null;
    };

    const handleInterruptedPointer = () => {
        activePointerId = null;
        isTouching = false;
        if (currentJelly && currentJelly.isStatic && !isGameOver) {
            const released = currentJelly;
            currentJelly = null;
            Body.setStatic(released, false);
            dropGraceUntil.set(released, performance.now() + 2200);
            topZoneTimers.delete(released);
            Body.setVelocity(released, { x: 0, y: 0 });
            Body.setAngularVelocity(released, 0);
            scheduleGameSave();
        }
    };

    canvas.addEventListener('pointerdown', handleStart, { passive: false });
    canvas.addEventListener('pointermove', handleMove, { passive: false });
    canvas.addEventListener('pointerup', handleEnd, { passive: false });
    canvas.addEventListener('pointercancel', handleEnd, { passive: false });
    canvas.addEventListener('lostpointercapture', handleEnd, { passive: false });
    window.addEventListener('jelly-layout-change', handleInterruptedPointer);
    window.addEventListener('blur', handleInterruptedPointer);

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach(pair => {
            const { bodyA, bodyB } = pair;
            if (bodyA.label && bodyA.label === bodyB.label && bodyA.label.startsWith('jelly_')) {
                const lvl = bodyA.level;
                if (lvl < 10) {
                    const midX = (bodyA.position.x + bodyB.position.x) / 2;
                    const midY = (bodyA.position.y + bodyB.position.y) / 2;
                    const parentsEnteredPlayfield =
                        hasEnteredPlayfield.has(bodyA) || hasEnteredPlayfield.has(bodyB);
                    if (Composite.get(engine.world, bodyA.id, 'body') && Composite.get(engine.world, bodyB.id, 'body')) {
                        Composite.remove(engine.world, [bodyA, bodyB]);
                        if (soundEnabled) playGameSfx(mergeSound);
                        const nextLvl = lvl + 1;
                        const newJelly = Bodies.circle(midX, midY, jellyConfigs[nextLvl].r, {
                            label: 'jelly_' + nextLvl, restitution: 0.1, friction: 0.9, render: { visible: false }
                        });
                        newJelly.level = nextLvl;
                        if (parentsEnteredPlayfield) hasEnteredPlayfield.add(newJelly);
                        Composite.add(engine.world, newJelly);
                        score += (lvl + 1) * 8;
                        document.getElementById('score').innerText = score;
                        if (score > highscore) {
                            highscore = score;
                            document.getElementById('highscore').innerText = highscore;
                            localStorage.setItem("jellyHighscore", highscore);
                        }
                        scheduleGameSave();
                    }
                }
            }
        });
    });

    Events.on(engine, 'afterUpdate', () => {
        if (isGameOver) return;
        const now = performance.now();
        engine.world.bodies.forEach(body => {
            if (!body.label || !body.label.startsWith('jelly_') || body.isStatic) return;
            // 剛放下的水母仍在出生區域時，不參與滿出判定。
            // 否則它可能在出生點短暫停留時，被誤認為已經堆到警戒線。
            const graceUntil = dropGraceUntil.get(body);
            if (graceUntil && now < graceUntil) {
                topZoneTimers.delete(body);
                return;
            }
            if (graceUntil) dropGraceUntil.delete(body);

            const radius = jellyConfigs[body.level]?.r || body.circleRadius || 0;

            // 水母必須先完整落到警戒線下方，才取得滿出判定資格。
            // 出生點在警戒線上方；若水母卡在出生點，不能因此直接判定遊戲結束。
            if (body.position.y > DEADLINE_Y + radius) {
                hasEnteredPlayfield.add(body);
            }
            if (!hasEnteredPlayfield.has(body)) {
                topZoneTimers.delete(body);
                return;
            }

            const speed = Math.hypot(body.velocity.x, body.velocity.y);
            const isAboveLine = body.position.y < DEADLINE_Y;
            const isSettled = speed < 0.12 && Math.abs(body.angularVelocity) < 0.025;

            if (isAboveLine && isSettled) {
                if (!topZoneTimers.has(body)) topZoneTimers.set(body, now);
                // 曾經完整進入遊戲區域，之後又被堆回警戒線上方並停穩，才判定滿出。
                if (now - topZoneTimers.get(body) >= 1200) {
                    isGameOver = true;
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                    saveGame();
                }
            } else {
                topZoneTimers.delete(body);
            }
        });
    });
}

function drawLoop() {
    Events.on(render, 'afterRender', () => {
        const ctx = render.context;
        const bodies = engine.world.bodies;

        if (currentJelly && currentJelly.isStatic) {
            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.moveTo(currentJelly.position.x, currentJelly.position.y + jellyConfigs[currentJelly.level].r);
            ctx.lineTo(currentJelly.position.x, render.options.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        // 使用獨立記錄的前一個物理狀態與目前狀態插值，減少畫面跳格。
        const alpha = physicsAlpha;
        for (let i = 0; i < bodies.length; i++) {
            const body = bodies[i];
            if (!body.label || !body.label.startsWith('jelly_')) continue;

            const sprite = jellySprites[body.level];
            if (!sprite) continue;

            const prevX = Number.isFinite(body._jellyRenderPrevX) ? body._jellyRenderPrevX : body.position.x;
            const prevY = Number.isFinite(body._jellyRenderPrevY) ? body._jellyRenderPrevY : body.position.y;
            const prevAngle = Number.isFinite(body._jellyRenderPrevAngle) ? body._jellyRenderPrevAngle : body.angle;
            const x = body.isStatic ? body.position.x : prevX + (body.position.x - prevX) * alpha;
            const y = body.isStatic ? body.position.y : prevY + (body.position.y - prevY) * alpha;
            let angleDiff = body.angle - prevAngle;
            if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            const angle = body.isStatic ? body.angle : prevAngle + angleDiff * alpha;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.drawImage(sprite.canvas, -sprite.offset, -sprite.offset, sprite.size, sprite.size);
            ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([15, 10]);
        ctx.moveTo(0, DEADLINE_Y);
        ctx.lineTo(render.options.width, DEADLINE_Y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();
    });
}

init();
const soundToggle = document.getElementById('sound-toggle');

function updateSoundButton() {
    soundToggle.innerText = soundEnabled ? '🔊 音效 ON' : '🔇 音效 OFF';
    soundToggle.classList.toggle('off', !soundEnabled);
    soundToggle.title = soundEnabled ? '遊戲音效開啟' : '遊戲音效關閉';
}

soundToggle.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    localStorage.setItem('jellySoundEnabled', String(soundEnabled));
    updateSoundButton();
    if (!soundEnabled) {
        mergeSound.pause();
        dropSound.pause();
        mergeSound.currentTime = 0;
        dropSound.currentTime = 0;
    }
});
updateSoundButton();

</script>
</body>
